name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2 numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 librosa==0.11.0 soundfile==0.13.1
      - run: python -m pytest -q
